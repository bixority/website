    <section class="section contact" aria-labelledby="contact-title">
      <div class="wrap">
        <div class="section__head">
          <h2 id="contact-title">{{ contact_title }}</h2>
          <p>{{ contact_lede }}</p>
        </div>
        <div class="contact__address">
          <a class="contact__email" id="contact-email" href="mailto:{{ email }}">{{ email }}</a>
          <button class="copy" type="button" data-copy="{{ email }}" data-target="contact-email" data-done="{{ copy_done }}" data-failed="{{ copy_failed }}" hidden>{{ copy_button }}</button>
          <span class="copy__status" data-copy-status aria-live="polite"></span>
        </div>
      </div>
    </section>
